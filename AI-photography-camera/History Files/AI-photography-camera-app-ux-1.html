.app-ui .section-title>button{padding:8px;min-height:44px;border:0;background:transparent;color:var(--accent)}
.app-ui .fact b{max-width:70%;overflow-wrap:anywhere;text-align:right}

.app-ui .compact-note{font-size:12px;color:var(--muted);margin:8px 0 16px}

appPage('APP-01','学习概览','学习回顾',()=>{const records=activeRecords();const topics=[...new Set(records.map(r=>r.topic))];return `${appHead('Lina 的探索','APP-00',go('APP-13',ico('settings'),'icon-button'))}<div class="summary-lead"><h3>最近发现了什么？</h3><p>${records.length?`近 ${appState.range} 天探索了 ${topics.length} 个主题，最新发现是${H(records[0].name)}。`:'还没有新的发现，孩子可以先从拍万物开始。'}</p></div>${tags([7,30,90].map(n=>`近 ${n} 天`),`近 ${appState.range} 天`,'range')}<div class="metrics"><div class="metric"><b>${records.length}</b><small>有效探索</small></div><div class="metric"><b>${topics.length}</b><small>探索主题</small></div><div class="metric"><b>${records.filter(r=>r.question).length}</b><small>主动提问</small></div></div><div class="module-grid">${item('APP-02','探索范围','查看兴趣方向','compass')}${item('APP-04','发现记录','回看问题与回答','messages-square')}${item('APP-06','探索任务','选择与查看任务','list-checks')}${item('APP-09','相册','照片与收藏','images')}</div>${section('最近的发现',records.length?recordCard(records[0]):empty('还没有发现记录','设备上的探索会在联网后出现在这里'))}${records.length?section('今晚可以聊一聊',`<p class="quote">${H(records[0].question)}</p>${go('APP-05','查看这次发现','text-action',records[0].id)}`):''}${go('APP-08','查看本周探索回顾','text-action')}`},'由宿主 App 的设备卡片进入；首页直达范围、记录、任务和相册。','时间筛选同步影响主题和记录。左上角 < 返回原 App 设备列表。','不展示理解分数或设备记录待同步；所有数字由演示记录计算。');
appPage('APP-02','探索范围','学习回顾',()=>`${appHead('探索范围')}${tags([7,30,90].map(n=>`近 ${n} 天`),`近 ${appState.range} 天`,'range')}${[...new Set(appState.records.filter(r=>!r.deleted&&r.day<appState.range).map(r=>r.topic))].map(topic=>section(topic,item('APP-03',`${appState.records.filter(r=>!r.deleted&&r.day<appState.range&&r.topic===topic).length} 次探索`,'查看对象、问题与原始记录','compass',topic))).join('')}${section('统计依据',`<p class="definition">统计所选时间内已确认的探索会话。重复上传不重复计数；音乐、录音、闹钟及相册浏览不计入。</p>`)}${go('APP-29','查看统计说明','text-action')}`,'首页进入；按 7、30、90 天查看主题。','主题进入自己的详情，返回保留时间范围。','零记录显示空状态；未确认识别和无效照片不计入，统计不代表掌握程度。');
appPage('APP-03','主题详情','学习回顾',()=>{const topic=appState.topic==='全部'?'玩具与模型':appState.topic;const rs=appState.records.filter(r=>!r.deleted&&r.topic===topic&&r.day<appState.range);return `${appHead(topic,'APP-02')}<p class="muted">近 ${appState.range} 天 · ${rs.length} 次探索</p>${section('探索过的对象',`<div class="list">${rs.map(recordCard).join('')||empty('这个时间段还没有记录','换一个时间范围再看看')}</div>`)}${section('可以继续探索',`<div class="list">${appState.tasks.filter(t=>t.topic===topic).map(taskCard).join('')}</div>`)}`},'从探索范围或记录中的主题进入，携带主题标识。','对象进入对应发现记录；任务进入对应任务。','不展示理解百分比；没有相关任务时不提供无关推荐。');
appPage('APP-04','发现记录','学习回顾',()=>`${appHead('发现记录')}${tags(['全部','玩具与模型','天气与天空','生活物品'],appState.topic,'topic')}${tags([7,30,90].map(n=>`近 ${n} 天`),`近 ${appState.range} 天`,'range')}<div class="list">${activeRecords().map(recordCard).join('')||empty('没有符合条件的发现','可以清除筛选查看全部记录',act('clear-filters','清除筛选','primary'))}</div>`,'从首页或主题进入；日期与主题组合筛选。','每条记录按 record_id 打开；返回保留筛选和位置。','空结果可清除筛选；只呈现已确认记录，不出现待上传队列。');
appPage('APP-05','发现记录详情','学习回顾',()=>{const r=appRecord();if(!r||r.deleted)return `${appHead('发现记录','APP-04')}${empty('这条记录已删除','照片和任务按各自规则保留',go('APP-04','返回记录','primary'))}`;return `${appHead(r.name,'APP-04',go('APP-21',ico('trash-2'),'icon-button'))}${photoForRecord(r)}<div class="facts">${fact('探索时间',r.date)}${fact('回答来源',r.source)}</div>${section('孩子的问题',`<p class="quote">${H(r.question)}</p>`)}${section('当时的回答',`<p class="definition">${H(r.answer)}</p>`)}${go('APP-03',H(r.topic),'text-action',r.topic)}<div class="actions">${go('APP-10','查看照片','',r.image)}${r.task?go('APP-07','查看相关任务','primary',r.task):go('APP-06','选择探索任务','primary')}</div>`},'从对应记录进入；保留原始提问、回答和来源。','查看照片和相关任务均携带自身标识，不遥控设备重新播放。','照片删除不删除文字；删除整条记录需独立确认，且说明是否同时删除照片。');
appPage('APP-06','探索任务','任务协同',()=>{const ts=appState.tasks.filter(t=>appState.taskFilter==='全部'||(appState.taskFilter==='待办'?['queued','received','active','paused','cancelling'].includes(t.status):appState.taskFilter==='推荐'?t.status==='draft':appState.taskFilter==='已完成'?t.status==='completed':['expired','skipped','cancelled','failed'].includes(t.status)));return `${appHead('探索任务','APP-01',go('APP-16',ico('bell'),'icon-button'))}<p>选择适合今天的探索，交给孩子自行开始。</p>${tags(['全部','推荐','待办','已完成','其他'],appState.taskFilter,'task-filter')}<div class="list">${ts.map(taskCard).join('')||empty('这里暂时没有任务','返回全部查看其他任务',act('all-tasks','查看全部','primary'),'list-checks')}</div>${section('设备待办',`<p class="definition">${appState.tasks.filter(t=>['queued','received','active','paused','cancelling'].includes(t.status)).length} / 3 个。待办包含待送达、已接收、探索中和暂停的任务。</p>`)}`},'首页或相关主题进入；任务按状态分组。','家长仅发送任务和查看结果，不能代替孩子勾选。','3 个待办共用上限；离线发送保留为等待送达；第四个进入待办已满说明。');
appPage('APP-07','任务详情','任务协同',()=>taskDetailHTML(),'任务列表按任务标识进入，不共用固定任务内容。','家长发送后等待设备接收，儿童开始和完成由设备回执确认。','有效期只约束未开始任务；暂停和恢复不重建任务；拍照不等于能力通过。');
appPage('APP-07A','发送失败','任务协同',()=>taskDetailHTML(appState.tasks[0],'failed'),'任务下发请求明确失败时进入。','重试沿用同一任务实例，离线不是永久失败。','未知送达结果保留等待状态，避免另建重复任务。',()=>{appState.taskKey='roll';appTask().status='failed'});
appPage('APP-07B','进行中任务','任务协同',()=>taskDetailHTML(appState.tasks[1]),'设备回传开始或暂停事件后查看。','展示影子任务自己的步骤和当前进度，家长不能代完成。','设备离线时展示最后确认进度；不推断失败或主动催促。',()=>{appState.taskKey='shadow'});
appPage('APP-07C','完成任务回顾','任务协同',()=>taskDetailHTML(appState.tasks[2]),'点击已完成的积木桥任务。','回看完成时间、孩子确认方式及关联照片。','照片未上传、家长未开启保存、已删除三种状态分开说明。',()=>{appState.taskKey='bridge'});
appPage('APP-07D','任务过期','任务协同',()=>taskDetailHTML(appState.tasks[3],'expired'),'超过未开始任务的有效期。','重新发送创建新任务实例；旧历史保留。','已开始或已暂停任务不会因推荐到期被强制清空。',()=>{appState.taskKey='texture';appTask().status='expired'});
appPage('APP-07E','设备待办已满','任务协同',()=>`${appHead('设备待办已满','APP-06')}${empty('先留一点探索空间','设备已有 3 个待办。可以撤回一份尚未开始的任务，或等孩子完成后再发送。',go('APP-06','查看设备待办','primary'),'list-checks')}`,'发送前检测到待办数量达到 3 个。','保持任务未发送，不挤掉已有任务。','服务端也校验名额；并发发送不得超额，正在探索的任务不能被家长删除。');
appPage('APP-08','本周探索回顾','学习回顾',()=>{const done=appState.tasks.filter(t=>t.status==='completed');return `${appHead('本周探索回顾')}<h3>每一次发现都值得聊聊</h3>${section('本周的新发现',`<div class="list">${appState.records.filter(r=>!r.deleted&&r.day<7).map(recordCard).join('')}</div>`)}${section('完成过的探索',`<div class="list">${done.map(taskCard).join('')||empty('还没有完成任务','孩子可以按自己的节奏探索')}</div>`)}<p class="fold-note">这里记录实际探索，不设置连续打卡奖励或能力排名。</p>`},'从首页查看本周实际记录与完成任务。','条目均可回到原始发现，不强制保持连续天数。','不足一周仍展示已有内容；不使用无定义的成长百分比。');
appPage('APP-09','相册','相册与数据',()=>{const ps=appState.photos.filter(mediaVisible).filter(p=>appState.albumFilter==='全部'||(appState.albumFilter==='收藏夹'?p.favorite:p.day<7));return `${appHead('相册')}${tags(['全部','收藏夹','最近拍摄'],appState.albumFilter,'album-filter')}<p class="muted">${ps.length} 张照片与作品</p>${appState.policy.photos?'':banner('新照片只留在设备上','已保存到 App 的照片仍可查看。')}${section('照片与作品',`<div class="album-grid">${ps.map(mediaCard).join('')}</div>${!ps.length?empty('这里还没有照片','可查看全部，或调整新照片保存设置。',act('all-photos','查看全部','primary')):''}`)}${go('APP-11','最近删除','text-action')}${go('APP-15','照片保存设置','text-action')}<p class="fold-note">照片收藏在此查看。百科卡片与单词收藏仅保存在设备；音乐和录音不会进入 App。</p>`},'首页直接进入，也可从设备详情进入。','浏览照片、生成作品和照片收藏；详情按 media_id 打开。','仅展示已保存到 App 的图片；本地知识收藏不混入照片，最近删除单独可达。');
appPage('APP-10','照片详情','相册与数据',()=>{const p=appMedia();if(!p||p.deletedAt)return `${appHead('照片详情','APP-09')}${empty('照片已移入最近删除','7 天内可以恢复，相关发现和任务历史仍保留。',go('APP-11','查看最近删除','primary'))}`;const r=appState.records.find(r=>r.id===p.record&&!r.deleted);return `${appHead(p.name,'APP-09',go('APP-20',ico('trash-2'),'icon-button'))}${appPhoto(p.id,'photo large')}<div class="facts">${fact('拍摄时间',p.date)}${fact('类型',p.kind==='art'?'AI 生成作品':'设备照片')}</div><div class="actions">${act('favorite-photo',`${ico('heart')}${p.favorite?'取消收藏':'加入收藏'}`)}${r?go('APP-05','查看发现记录','primary',r.id):''}</div>${section('关联内容',r?.task?item('APP-07','相关探索任务','回看任务与完成历史','list-checks',r.task):'<p class="muted">没有关联任务</p>')}${banner('删除照片的影响','照片将移入最近删除，保留 7 天。提问、回答及任务完成历史不会同时删除。')}`},'点击任一照片携带图片标识进入。','收藏双向同步，查看发现只在 App 中打开原始内容，不远程播报。','原图不可用显示明确原因；删除照片不删除关联文字和任务完成状态。');
appPage('APP-11','最近删除','相册与数据',()=>`${appHead('最近删除','APP-09')}<p class="muted">删除后保留 7 天，到期自动清除。</p>${section('可恢复照片',`<div class="album-grid">${appState.photos.filter(p=>p.deletedAt).map(mediaCard).join('')}</div>${!appState.photos.some(p=>p.deletedAt)?empty('没有最近删除的照片','删除的照片会在这里保留 7 天。'):''}`)}`,'相册内进入最近删除。','选择照片后恢复；恢复不重新计入探索次数。','到期或已永久删除不可恢复；原型使用一个已删除样例展示详情页。');
appPage('APP-12','恢复或永久删除','相册与数据',()=>{const p=appMedia();return `${appHead('最近删除详情','APP-11')}${appPhoto(p?.id||'roll')}<h3 style="margin-top:12px">${H(p?.name||'会滚动的物品')}</h3>${banner('删除后 7 天内可恢复','恢复后回到原相册位置；不会新增学习统计。')}<div class="actions">${primary('restore-photo','恢复照片')}${go('APP-22','永久删除','danger')}</div>`},'从最近删除选择一张照片。','恢复照片及其删除前的收藏状态；位置按拍摄时间还原。','永久删除需要家长再次确认，不能用一键清空替代。');
appPage('APP-13','设备与家长设置','家长控制',()=>`${appHead('设备与家长设置')}<div class="list">${item('APP-14','设备详情','电量、存储与最近在线','camera')}${item('APP-15','家长控制','使用边界、联网 AI 与照片保存','shield-check')}${item('APP-16','探索提醒','提醒时间与开关','bell')}${item('APP-17','AI 服务','联网能力与离线范围','sparkles')}${item('APP-18','隐私与数据','保留、导出与删除','lock-keyhole')}${item('APP-09','相册','照片与收藏夹','images')}</div>`,'首页设置入口进入。','各管理项独立进入，返回到此页面。','不提供音乐、录音管理或新的 App 绑定流程。');
appPage('APP-14','设备详情','家长控制',()=>`${appHead('Lina 的拍学机','APP-13')}${banner(appState.network==='offline'?'设备当前离线':'设备在线','最近确认：2026-09-09 09:40')}<div class="facts">${fact('儿童档案','Lina')}${fact('电量','86%')}${fact('存储','剩余 3.8 GB')}${fact('固件版本','v1.2.0')}${fact('规则状态',appState.policyState==='applied'?'设备已生效':'等待设备确认')}</div>${item('APP-09','相册','查看已保存的照片','images')}${item('APP-15','家长控制','查看当前规则','shield-check')}<p class="fold-note">绑定、换绑和重新配网使用宿主 App 的固定流程，本页不重复设计。</p>`,'设置进入设备详情。','设备离线仍可查看已保存的记录和照片。','电量和存储需标明更新时间，不把旧数据当作实时状态。');
appPage('APP-15','家长控制','家长控制',()=>{const d=appState.policyDraft;return `${appHead('家长控制','APP-13')}${banner(appState.policyState==='applied'?'当前规则已在设备生效':appState.policyState==='failed'?'规则尚未生效':'已保存，等待设备确认',appState.policyState==='applied'?'修改后点击保存。':'设备当前仍使用上一版规则。')}${appState.formError?banner('请检查设置',appState.formError,'bad'):''}<label class="control-row"><span><b>允许联网 AI</b><small>识别、追问、AI 对讲与绘图</small></span><input type="checkbox" data-policy="cloud" ${d.cloud?'checked':''}></label><label class="control-row"><span><b>在 App 查看新照片</b><small>关闭后新照片仅留在设备；旧照片不会自动删除</small></span><input type="checkbox" data-policy="photos" ${d.photos?'checked':''}></label><div class="form-field"><span>每日可用时段</span><div class="row"><input aria-label="每日开始时间" type="time" data-policy="start" value="${d.start}"><span>至</span><input aria-label="每日结束时间" type="time" data-policy="end" value="${d.end}"></div><small>本版支持同一天内的时段。</small></div><label class="form-field"><span>连续使用多久后休息</span><select class="full" data-policy="duration">${[15,30,45,60].map(v=>`<option value="${v}" ${v===d.duration?'selected':''}>${v} 分钟</option>`).join('')}</select></label><label class="control-row"><span>音量上限 <b>${d.volume}%</b></span><input aria-label="音量上限" type="range" min="20" max="80" step="10" data-policy="volume" value="${d.volume}"></label>${banner('任务照片','关闭照片云端保存不影响孩子完成任务。App 只显示进度与完成时间，照片留在设备。')}<div class="actions">${act('reset-policy','放弃更改')}${primary('save-policy','保存设置')}</div>${go('APP-16','设置探索提醒','text-action')}`},'设置或照片保存入口进入；先编辑，保存后提交新规则版本。','保存后显示等待确认；仅在设备回执到达后显示生效。','跨日时段不接受；联网 AI 关闭阻止新的云端请求，已有本地能力继续使用。');
appPage('APP-16','探索提醒','家长控制',()=>`${appHead('探索提醒','APP-13')}<label class="control-row"><span><b>每日探索提醒</b><small>仅在有待办且设备可用时轻提醒一次</small></span><input type="checkbox" data-policy="reminder" ${appState.policyDraft.reminder?'checked':''}></label><label class="form-field"><span>提醒时间</span><input aria-label="探索提醒时间" type="time" data-policy="time" value="${appState.policyDraft.time}"></label>${banner('孩子可以稍后再做','提醒不会打开相机、强制开始任务，也不会打断拍摄、录音或播放。')}<p class="definition">按设备所在时区执行。休息时段内不补发催促提醒；没有任务时不提醒。</p><div class="actions">${act('reset-policy','放弃更改')}${primary('save-policy','保存提醒')}</div>`,'任务页铃铛或设置进入。','时间与开关一起保存；关闭后停止后续提醒。','提醒不是闹钟内容管理。设备离线使用已生效规则，不制造重复提醒。');

appPage('APP-18','隐私与数据','相册与数据',()=>`${appHead('隐私与数据','APP-13')}<div class="facts">${fact('云端学习记录','默认保留 90 天')}${fact('最近删除照片','保留 7 天')}${fact('本地音乐与录音','不上传 App')}</div><p class="definition">照片云端保存与联网 AI 处理是两种用途，分别受控。原始对讲录音不作为相册内容保存，不用于未经授权的训练或广告。</p>${section('数据操作',`<div class="list">${item('APP-19','导出学习数据','选择时间范围和图片','download')}${item('APP-23','删除全部学习数据','照片、发现记录和探索任务','trash-2')}${item('APP-15','照片保存与 AI 权限','查看或修改授权','shield-check')}</div>`)}${appState.dataRequest?go('APP-24','查看删除处理结果','text-action'):''}<p class="fold-note">本地照片不因云端 90 天保留期自动删除。目标市场的法务审核和宿主 App 监护人认证仍是上线前提。</p>`,'家长设置进入数据与隐私。','显示数据范围、用途、期限和可执行操作。','全量删除不解除绑定，不处理本地音乐、录音和闹钟；系统缓存与索引也在删除范围内。');

function appSelect(value,screen=''){if(screen==='APP-03'){appState.topic=value;return}if(['APP-10','APP-12','APP-20','APP-22'].includes(screen)){appState.mediaId=value;return}if(appState.records.some(r=>r.id===value)){appState.recordId=value;return}if(appState.tasks.some(t=>t.key===value))appState.taskKey=value}
function completeAppTask(){const t=appTask();if(!['received','active','paused'].includes(t.status)){announce('先选择一个已接收的任务');return}t.status='completed';t.step=t.steps.length;t.completedAt=today+' 10:20';t.photoAccess=appState.policy.photos?'available':'withheld';t.evidence=t.key==='shadow'?['cloud','shadow']:t.key==='bridge'?['bridge']:['roll'];if(t.photoAccess==='available')for(const id of t.evidence)if(!appState.photos.some(p=>p.id===id))appState.photos.push({id,name:t.title,date:t.completedAt,day:0,favorite:false,deletedAt:null,kind:'photo'});appUI.refresh();announce('已模拟设备完成回执')}
function reconcileApp(){if(appState.network!=='online')return;for(const t of appState.tasks){if(t.status==='queued')t.status='received';if(t.status==='cancelling')t.status='cancelled'}if(appState.policyState==='pending')appState.policyState='applied';if(appState.dataRequest?.cloud==='done')appState.dataRequest.status='done'}
function appHandle(action,b,ui){const t=appTask();if(action==='range'){appState.range=Number(b.dataset.value.match(/\d+/)[0]);ui.refresh()}else if(action==='topic'){appState.topic=b.dataset.value;ui.refresh()}else if(action==='clear-filters'){appState.topic='全部';appState.range=90;ui.refresh()}else if(action==='task-filter'||action==='all-tasks'){appState.taskFilter=action==='all-tasks'?'全部':b.dataset.value;ui.refresh()}else if(action==='album-filter'||action==='all-photos'){appState.albumFilter=action==='all-photos'?'全部':b.dataset.value;ui.refresh()}else if(action==='send-task'){
 if(appState.tasks.filter(x=>['queued','received','active','paused','cancelling'].includes(x.status)&&x.key!==t.key).length>=3){ui.open('APP-07E');return}if(['expired','cancelled','skipped'].includes(t.status)){t.version++;t.step=0;t.evidence=[]}t.taskId=t.taskId&&t.status==='failed'?t.taskId:'TASK-'+t.key.toUpperCase()+'-'+Date.now();t.status=appState.network==='failure'?'failed':'queued';ui.open('APP-07');if(appState.network==='online')setTimeout(()=>{if(t.status==='queued')t.status='received';ui.refresh()},800)
 }else if(action==='withdraw-task'){if(!['queued','received'].includes(t.status)){announce('孩子已经开始，不能直接撤回');return}t.status='cancelling';ui.refresh();if(appState.network==='online')setTimeout(()=>{if(t.status==='cancelling')t.status='cancelled';ui.refresh()},800)}else if(action==='favorite-photo'){const p=appMedia();if(p&&!p.deletedAt){p.favorite=!p.favorite;ui.refresh();announce(p.favorite?'已加入照片收藏夹':'已取消收藏')}}else if(action==='delete-photo'){
 const p=appMedia();if(p)p.deletedAt=today;ui.open('APP-09');announce(appState.network==='offline'?'App 照片已移入最近删除，设备联网后更新':'照片已移入最近删除，7 天内可恢复')
 }else if(action==='restore-photo'){const p=appMedia();if(p)p.deletedAt=null;ui.open('APP-09');announce('照片已恢复')}else if(action==='delete-record'){
 const r=appRecord();if(r){r.deleted=true;if(checkedChoice('deleteRecordPhoto')){const p=appState.photos.find(p=>p.record===r.id);if(p)p.deletedAt=today}}appState.dataRequest={cloud:'done',status:appState.network==='online'?'done':'pending',label:'仅处理这条发现记录及你选中的照片。'};ui.open('APP-24')
 }else if(action==='permanent-photo'){if(!checkedChoice('confirmPermanent'))return;appState.photos=appState.photos.filter(p=>p.id!==appState.mediaId);appState.dataRequest={cloud:'done',status:appState.network==='online'?'done':'pending',label:'当前照片永久删除，关联记录和任务历史保留。'};ui.open('APP-24')
 }else if(action==='delete-all'){if(!checkedChoice('confirmAll'))return;appState.records=[];appState.photos=[];appState.tasks=[];appState.dataRequest={cloud:'done',status:appState.network==='online'?'done':'pending',label:'照片、发现记录与任务已从 App 清除。设备本地音乐、录音和闹钟不受影响。'};ui.open('APP-24')
 }else if(action==='save-policy'){
 if(appState.policyDraft.start>=appState.policyDraft.end){appState.formError='结束时间需要晚于开始时间。';ui.open('APP-15');return}appState.formError='';appState.policy=structuredClone(appState.policyDraft);appState.policyVersion++;appState.policyState=appState.network==='failure'?'failed':'pending';ui.refresh();if(appState.network==='online')setTimeout(()=>{appState.policyState='applied';ui.refresh()},800)
 }else if(action==='reset-policy'){appState.policyDraft=structuredClone(appState.policy);appState.formError='';ui.refresh();announce('已恢复到上次保存的规则')}else if(action==='prepare-export'){appState.exportState='processing';ui.refresh();setTimeout(()=>{appState.exportState='ready';ui.refresh()},600)}else if(action==='download-export'){saveFile('LUMIQ-learning-demo.json',JSON.stringify({demo:true,periodDays:Number(appState.exportRange),records:appState.records.filter(r=>!r.deleted&&r.day<Number(appState.exportRange)),tasks:appState.tasks.filter(t=>t.status==='completed'),photos:appState.exportImages?appState.photos.filter(p=>!p.deletedAt&&p.day<Number(appState.exportRange)).map(p=>({...p,imageData:ASSETS[p.id]||ASSETS.roll})):[]},null,2))}else if(action==='demo-start'){if(t&&t.status==='received'){t.status='active';ui.refresh()}else announce('请选择设备已接收的任务')}else if(action==='demo-complete'){completeAppTask()}else if(action==='demo-receipt'){reconcileApp();ui.refresh();announce('已模拟在线设备回执')}

function taskDraftProblem(d){
 if(!d)return '请先选择模板或创建自定义任务。';
 if(!d.title.trim()||d.title.trim().length>30)return '任务名称需要 1 至 30 个字。';
 if(!Array.isArray(d.steps)||!d.steps.length||d.steps.length>5||d.steps.some(s=>!s.trim()||s.trim().length>80))return '请填写每个步骤，每步 1 至 80 个字，最多 5 步。';
 if(!taskTopics.includes(d.topic)||![4,5,10,15,20].includes(Number(d.minutes)))return '请选择有效的主题和预计时长。';
 if(['goal','materials','safety'].some(k=>(d[k]||'').length>160))return '补充信息每项最多 160 个字。';
 return '';
}

revisedAppHandle=function(action,b,ui){
 if(action==='begin-custom-task'||action==='use-task-template'){
  if(!appState.taskDraft){const template=taskTemplates.find(t=>t.key===b.dataset.template);if(action==='use-task-template'&&!template)return;appState.taskDraft=makeTaskDraft(template)}
  appState.taskDraftError='';ui.open('APP-38');return;
 }
 if(action==='edit-parent-task'){
  const t=appTask();if(!t?.parentCreated||t.status!=='draft')return;
  if(appState.taskDraft&&appState.taskDraft.key!==t.key){ui.open('APP-38');announce('请先保存或放弃当前正在编辑的任务');return}
  if(!appState.taskDraft)appState.taskDraft={key:t.key,existing:true,title:t.title,topic:t.topic,minutes:t.minutes,goal:t.goal,materials:t.materials,safety:t.safety,steps:t.steps.map(([a,b])=>[a,b].filter(Boolean).join('。'))};
  ui.open('APP-38');return;
 }
 if(action==='add-task-step'||action==='remove-task-step'){
  const d=appState.taskDraft;if(!d)return;
  if(action==='add-task-step'&&d.steps.length<5)d.steps.push('');
  if(action==='remove-task-step'&&d.steps.length>1){const index=Number(b.dataset.index);if(Number.isInteger(index)&&index>=0&&index<d.steps.length)d.steps.splice(index,1)}
  ui.refresh();if(action==='add-task-step')document.getElementById('taskStep'+(d.steps.length-1))?.focus();return;
 }
 if(action==='discard-edit'||action==='request-delete-task'){
  const t=appTask();if(action==='request-delete-task'&&(!t?.parentCreated||t.status!=='draft'))return;
  appState.deleteTaskKey=action==='request-delete-task'?t.key:null;ui.open('APP-40');return;
 }
 if(action==='keep-task-edit'){ui.back(appState.deleteTaskKey?'APP-07':'APP-38');return}
 if(action==='confirm-task-discard'){
  const key=appState.deleteTaskKey;
  if(key){const t=appState.tasks.find(t=>t.key===key);if(!t?.parentCreated||t.status!=='draft'){ui.back('APP-06');return}appState.tasks=appState.tasks.filter(t=>t.key!==key);if(appState.taskDraft?.key===key)appState.taskDraft=null}
  else appState.taskDraft=null;
  appState.deleteTaskKey=null;appState.taskDraftError='';ui.finish('APP-06','',['APP-37','APP-38','APP-39','APP-40',...(key?['APP-07']:[])]);return;
 }
 if(action==='save-task-draft'||action==='save-send-task'){
  const d=appState.taskDraft;if(!d)return;
  const problem=taskDraftProblem(d);if(problem){appState.taskDraftError=problem;ui.refresh();document.getElementById(problem.startsWith('任务名称')?'taskTitle':'taskStep0')?.focus();return}
  const existing=appState.tasks.find(t=>t.key===d.key);if(existing&&existing.status!=='draft'){announce('任务已发送，不能覆盖设备正在使用的内容');return}
  const t={...(existing||{}),key:d.key,title:d.title.trim(),topic:d.topic,minutes:Number(d.minutes),goal:d.goal.trim()||d.title.trim(),materials:d.materials.trim()||'无需额外材料',safety:d.safety.trim()||'在安全环境中探索，遇到不确定的物品先请家长确认。',photo:'',steps:d.steps.map(s=>[s.trim(),'']),parentCreated:true,status:'draft',taskId:null,version:existing?.version||1,step:0,evidence:[],completionMethod:'child_confirmed',photoAccess:'available',completedAt:null,expiresAt:'发送后 7 天内开始'};
  if(existing)Object.assign(existing,t);else appState.tasks.unshift(t);
  appState.taskDraft=null;appState.taskDraftError='';
  ui.finish('APP-07',t.key,['APP-37','APP-38','APP-39','APP-40']);
  if(action==='save-send-task')revisedAppHandle('send-task',b,ui);else announce('已保存任务草稿');return;
 }
 if(action==='send-task'&&appTask()?.parentCreated){
  const t=appTask();if(['queued','received','active','paused','completed','cancelling'].includes(t.status))return;
  if(appState.taskDraft?.key===t.key){ui.open('APP-38');announce('请先保存本次修改再发送');return}
  if(appState.tasks.filter(x=>['queued','received','active','paused','cancelling'].includes(x.status)&&x.key!==t.key).length<3){const due=new Date(today+'T00:00:00Z');due.setUTCDate(due.getUTCDate()+7);t.expiresAt=due.toISOString().slice(0,10)}
 }
 if(action==='demo-complete'&&appTask()?.parentCreated){
  const t=appTask();if(!['received','active','paused'].includes(t.status)){announce('先选择一个已接收的任务');return}
  t.status='completed';t.step=t.steps.length;t.completedAt=today+' 10:20';t.photoAccess=appState.policy.photos?'available':'withheld';t.evidence=[];ui.refresh();announce('已模拟设备完成回执');return;
 }
 const clearEditor=action==='delete-all'&&appState.network!=='failure'&&checkedChoice('confirmAll');
 const result=mobileTaskHandle(action,b,ui);
 if(clearEditor){appState.taskDraft=null;appState.taskDraftError='';appState.deleteTaskKey=null;writeStore(APP_KEY,appState)}
 return result;
};

// Remember the exact choice made before a failed request. Retry uses that choice,
// rather than reading checkboxes from a confirmation screen that is no longer mounted.
const checkedChoice=id=>appState.retrySelection?.[id]??!!document.getElementById(id)?.checked;
const auditedActionBase=revisedAppHandle;
revisedAppHandle=function(action,b,ui){
 if(action==='retry-data-action'){
  if(appState.network==='failure'){announce('网络仍然不可用，请稍后重试');return}
  const request=appState.failedAction;
  if(!request?.action){appState.failedAction=null;ui.back('APP-18');return}
  appState.mediaId=request.mediaId;appState.recordId=request.recordId;
  appState.exportRange=request.exportRange;appState.exportImages=request.exportImages;
  appState.retrySelection=request.choices;appState.failedAction=null;
  try{
   if(request.action==='prepare-export')ui.finish('APP-19','',['APP-31']);
   revisedAppHandle(request.action,b,ui);
  }finally{delete appState.retrySelection;writeStore(APP_KEY,appState)}
  return;
 }
 if(action==='data-later')appState.failedAction=null;
 const dataActions=['delete-photo','restore-photo','delete-record','permanent-photo','delete-all','prepare-export'];
 if(dataActions.includes(action)){
  if(['delete-photo','restore-photo','permanent-photo'].includes(action)){
   const photo=appMedia();
   if(!photo||(action==='delete-photo'?photo.deletedAt:!photo.deletedAt)){
    announce('照片状态已变化，请返回相册查看');return;
   }
  }
  if(action==='delete-record'&&(!appRecord()||appRecord().deleted)){announce('这条发现已不存在');return}
  if(action==='permanent-photo'&&!checkedChoice('confirmPermanent')||action==='delete-all'&&!checkedChoice('confirmAll'))return;
  if(appState.network==='failure'){
   appState.failedAction={action,mediaId:appState.mediaId,recordId:appState.recordId,
    exportRange:appState.exportRange,exportImages:appState.exportImages,
    choices:{deleteRecordPhoto:checkedChoice('deleteRecordPhoto'),confirmPermanent:checkedChoice('confirmPermanent'),confirmAll:checkedChoice('confirmAll')}};
   ui.open('APP-31');return;
  }
  appState.failedAction=null;
 }
 return auditedActionBase(action,b,ui);
};
